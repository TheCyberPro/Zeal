<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ZEAL Catalogue</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    iframe {
      width: 90%;
      height: 85%;
      border: none;
      border-radius: 8px;
      background: #fff;
    }
    .controls {
      margin-top: 15px;
    }
    .controls a {
      background: #00c4ff;
      color: #fff;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      margin: 0 10px;
    }
    .controls a:hover {
      background: #0099cc;
    }
  </style>
</head>
<body>
  <!-- Embed your PDF -->
  <iframe src="assets/zealcatalogue.pdf"></iframe>

  <!-- Controls -->
  <div class="controls">
    <a href="index.html">← Back to Home</a>
    <a href="assets/zealcatalogue.pdf" download>Download Catalogue</a>
  </div>
</body>
</html>
